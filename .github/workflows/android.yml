name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App to PWA/APK
        run: |
          echo "Preparing Mahadev Wallpaper App build..."
          npm install -g @pwabuilder/pwabuilder-cli
          echo "Build script processed successfully."
          
